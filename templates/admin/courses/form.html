<!-- templates/admin/courses/form.html -->
{% extends 'admin/base_admin.html' %}
{% block title %}{% if course %}Редактирование курса{% else %}Новый курс{% endif %}{% endblock %}

{% block admin_content %}
<div class="main-container p-4" style="max-width:640px;">
    <a href="{% url 'admin_courses_list' %}" class="btn btn-outline-secondary btn-sm mb-3">
        <i class="fas fa-arrow-left me-1"></i>К списку курсов
    </a>
    <h2 class="mb-4">
        <i class="fas fa-graduation-cap me-2"></i>
        {% if course %}Редактирование курса{% else %}Новый курс{% endif %}
    </h2>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Название курса</label>
            <input type="text" name="name" class="form-control" value="{{ course.name|default:'' }}" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="4">{{ course.description|default:'' }}</textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'admin_courses_list' %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-admin-primary">
                <i class="fas fa-check me-1"></i>Сохранить
            </button>
        </div>
    </form>
</div>
{% endblock %}
